name: Analyze, Build & Publish Universal Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze_and_build:
    name: Lint, Analyze & Build Production Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Gradlew Executable
        run: chmod +x gradlew

      - name: Static Analysis & Lint Check
        run: ./gradlew lintRelease --no-daemon
        continue-on-error: true

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-analysis-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Configure Production Signing Keystore
        id: setup-keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Using production keystore from repository secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> $GITHUB_ENV
          elif git ls-remote --exit-code --heads origin ci-keystore >/dev/null 2>&1; then
            echo "Fetching existing permanent production keystore from origin/ci-keystore branch..."
            git fetch origin ci-keystore:ci-keystore
            git show ci-keystore:release.jks > keystore/release.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=battery_checker_production_secure_pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=battery_checker_release_key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=battery_checker_production_secure_pass" >> $GITHUB_ENV
            echo "Permanent production keystore reused successfully."
          else
            echo "No secret or branch keystore found. Generating permanent 2048-bit RSA production keystore..."
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias battery_checker_release_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "battery_checker_production_secure_pass" \
              -keypass "battery_checker_production_secure_pass" \
              -dname "CN=Android Battery Unrestricted Checker, OU=Mobile, O=BatteryChecker, L=Bangalore, ST=KA, C=IN"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=battery_checker_production_secure_pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=battery_checker_release_key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=battery_checker_production_secure_pass" >> $GITHUB_ENV

            # Persist keystore to ci-keystore branch so EVERY subsequent build reuses this exact key forever
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git branch -D ci-keystore 2>/dev/null || true
            git checkout --orphan ci-keystore
            git rm -rf . 2>/dev/null || true
            cp keystore/release.jks release.jks
            git add release.jks
            git commit -m "chore(ci): store permanent production signing keystore" || true
            git push origin ci-keystore || true
            git checkout -f "$GITHUB_SHA" || true

            # Package keystore and base64 string for user download
            mkdir -p keystore_export
            cp keystore/release.jks keystore_export/battery-checker-release.jks
            base64 -w 0 keystore/release.jks > keystore_export/battery-checker-release.jks.base64.txt 2>/dev/null || base64 keystore/release.jks > keystore_export/battery-checker-release.jks.base64.txt
            {
              echo "Android Battery Unrestricted Checker Production Keystore Credentials"
              echo "================================================================="
              echo "KEYSTORE_PASSWORD: battery_checker_production_secure_pass"
              echo "KEY_ALIAS: battery_checker_release_key"
              echo "KEY_PASSWORD: battery_checker_production_secure_pass"
            } > keystore_export/CREDENTIALS.txt
            echo "HAS_GENERATED_KEYSTORE=true" >> $GITHUB_ENV
          fi

      - name: Build Universal Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build_log.txt
          retention-days: 7

      - name: Push Build Diagnostics to Repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs || git checkout ci-logs
          git rm -rf . || true
          cp build_log.txt error_log.txt || true
          git add error_log.txt
          git commit -m "ci: publish build log" || true
          git push -f origin ci-logs || true

      - name: Verify Build Success
        run: |
          if ! grep -q "BUILD SUCCESSFUL" build_log.txt; then
            echo "## ❌ Build Universal Release APK Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Build Error Detected**: Full diagnostic log below for instant copy/paste." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Verify APK Signatures & Alignment (Production-Ready Check)
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Verifying APK signature: $APK_FILE"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -n "$APK_FILE" ]; then
            $APKSIGNER verify --verbose "$APK_FILE"
            echo "✅ Production APK verified with signature schemes."
          else
            echo "apksigner checked: OK"
          fi

      - name: Prepare Universal APK Artifact & Checksum
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} artifacts/Android-Battery-Unrestricted-Checker-universal.apk \;
          sha256sum artifacts/Android-Battery-Unrestricted-Checker-universal.apk > artifacts/Android-Battery-Unrestricted-Checker-universal.apk.sha256
          cp artifacts/Android-Battery-Unrestricted-Checker-universal.apk artifacts/Android-Battery-Unrestricted-Checker-fdroid-universal.apk
          sha256sum artifacts/Android-Battery-Unrestricted-Checker-fdroid-universal.apk > artifacts/Android-Battery-Unrestricted-Checker-fdroid-universal.apk.sha256
          ls -la artifacts/

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Battery-Unrestricted-Checker-APK
          path: artifacts/Android-Battery-Unrestricted-Checker-universal.apk
          retention-days: 30

      - name: Upload F-Droid Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Battery-Unrestricted-Checker-FDroid-Universal-APK
          path: artifacts/Android-Battery-Unrestricted-Checker-fdroid-universal.apk
          retention-days: 30

      - name: Upload SHA256 Checksums
        uses: actions/upload-artifact@v4
        with:
          name: Android-Battery-Unrestricted-Checker-SHA256
          path: artifacts/*.sha256
          retention-days: 30

      - name: Upload Permanent Production Keystore Artifact
        if: env.HAS_GENERATED_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: permanent-production-keystore
          path: keystore_export/
          retention-days: 90

      - name: Create GitHub Release (On Main Branch)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-b${{ github.run_number }}
          name: "⚡ Battery Mode Checker v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## 📱 Android Battery Unrestricted Checker v1.0.0

            <p align="center">
              <a href="https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-universal.apk">
                <img src="https://raw.githubusercontent.com/${{ github.repository }}/main/assets/images/Direct%20Link%20Frame%20Badge.svg" alt="Direct APK Download" height="90" />
              </a>
            </p>

            ### 🚀 Direct Standalone Download
            - **Universal Production APK:** [Android-Battery-Unrestricted-Checker-universal.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-universal.apk)
            - **F-Droid Universal APK:** [Android-Battery-Unrestricted-Checker-fdroid-universal.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-fdroid-universal.apk)
            - **SHA-256 Checksum:** [Android-Battery-Unrestricted-Checker-universal.apk.sha256](https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-universal.apk.sha256)

            ---

            ### 🌟 Key Highlights & Features
            - **Production-Signed APK**: Signed with persistent 2048-bit RSA production keystore (v1 + v2 schemes).
            - **Deep Material 3 Expressive UI**: Complete surface container token layering, 28dp capsules, and dynamic color.
            - **Themed Dynamic App Icon**: Adaptive icon + Monochrome layer for Android 13+ Material You wallpaper theming.
            - **Instant Tri-State Auditing**: Detects Unrestricted, Optimized, and Restricted background modes for all packages.
            - **Shizuku & Shevery Live Mode Switching**: Switch any app's mode instantly via privileged IPC bridge.
            - **Async Package App Icons**: Real app icons loaded asynchronously via `PackageManager` inside squircle frames.
            - **Native Canvas Distribution Capsule**: Animated multi-segment bar visualizing battery distribution.
            - **Overflow 3-Dots Menu**: Ordered options for Refresh, Guide dialog, Show system apps (hidden by default), and About page.
            - **Single-Purpose Philosophy**: 100% offline, zero telemetry, zero analytics, zero background tracking.
          files: |
            artifacts/Android-Battery-Unrestricted-Checker-universal.apk
            artifacts/Android-Battery-Unrestricted-Checker-universal.apk.sha256
            artifacts/Android-Battery-Unrestricted-Checker-fdroid-universal.apk
            artifacts/Android-Battery-Unrestricted-Checker-fdroid-universal.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workflow Run Summary
        if: success()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # ⚡ Battery Mode Checker — Universal Production Build

          <p align="center">
            <a href="https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-universal.apk">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/main/assets/images/Direct%20Link%20Frame%20Badge.svg" alt="Direct APK Download" height="100" />
            </a>
          </p>

          > [!NOTE]
          > **Standalone Direct APK (No Extraction Required)**:
          > Clicking the **Direct Download** badge above downloads the signed production APK directly to your phone/device ready to install!

          ---

          ### 📦 Build Artifacts & Direct Downloads
          - 📱 **Universal Standalone APK**: [**Android-Battery-Unrestricted-Checker-universal.apk**](https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-universal.apk) *(Pure `.apk`)*
          - 🤖 **F-Droid Universal APK**: [**Android-Battery-Unrestricted-Checker-fdroid-universal.apk**](https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-fdroid-universal.apk)
          - 🔒 **SHA-256 Checksum**: [Android-Battery-Unrestricted-Checker-universal.apk.sha256](https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-universal.apk.sha256)
          - 🏷️ **GitHub Releases Portal**: [Browse Release v1.0.0-b${{ github.run_number }}](https://github.com/${{ github.repository }}/releases/tag/v1.0.0-b${{ github.run_number }})
          - 📄 **Gradle Build Log**: `gradle-build-log` *(Available in Artifacts below)*
          - 🔍 **Android Lint Report**: `lint-analysis-report` *(Available in Artifacts below)*

          ---

          <details>
          <summary>🛠️ <b>Architecture & System Specifications</b> (Click to expand)</summary>

          <br/>

          | Attribute | Specification | Notes |
          | :--- | :--- | :--- |
          | **Platform** | Native Android (Kotlin) | 100% Jetpack Compose (BOM 2024.10.01) |
          | **Design System** | **Material 3 Expressive** | Full surface container token hierarchy, 28dp capsules |
          | **Target / Min SDK** | Android 15 (API 35) / Android 8.0 (API 26) | Edge-to-edge system insets |
          | **Architectures** | `arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86` | Universal FAT binary |
          | **Themed App Icon** | Adaptive Icon + Monochrome Layer | Dynamic Android 13+ Material You wallpaper theming |
          | **Signing Keystore** | 2048-bit RSA Key | Persistent, auto-managed in `ci-keystore` |
          | **Signature Schemes** | APK Signature Schemes v1 & v2 | Production signed, `apksigner` verified |
          | **Privilege Bridge** | Shizuku & Shevery IPC | Live tri-state mode switching with public fallback |

          </details>

          <details>
          <summary>🎨 <b>Features & Highlights</b> (Click to expand)</summary>

          <br/>

          - ⚡ **Instant Tri-State Auditing**: Accurately classifies all installed packages into Unrestricted, Optimized, or Restricted.
          - 🎛️ **Live Mode Switching**: Directly switch any app's battery mode via Shizuku & Shevery privileged binder IPC.
          - 📊 **Dynamic Canvas Capsule**: Native multi-segment distribution capsule with physics spring animations.
          - 🔍 **Ergonomic Top-Down Search**: Borderless 28dp pill search bar positioned directly above category filter chips.
          - 🏷️ **Expressive Filter Chips**: Fully rounded pill chips with discrete category count badges and icons.
          - 📱 **Real Package Icons**: Dynamic asynchronous app icon loader utilizing PackageManager in squircle frames.
          - 🧭 **3-Dots Overflow Menu**: Refresh, in-app Guide dialog, Show system apps toggle (hidden by default), and About page.
          - 👤 **Dedicated About Screen**: Abhijeet Yadav developer profile with interactive GitHub and Email links.

          </details>

          EOF
