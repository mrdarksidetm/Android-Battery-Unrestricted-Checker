name: Analyze, Build & Publish Universal Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze_and_build:
    name: Lint, Analyze & Build Production Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Gradlew Executable
        run: chmod +x gradlew

      - name: Static Analysis & Lint Check
        run: ./gradlew lintRelease --no-daemon
        continue-on-error: true

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-analysis-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Configure Production Signing Keystore
        id: setup-keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Using production keystore from repository secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> $GITHUB_ENV
          elif git ls-remote --exit-code --heads origin ci-keystore >/dev/null 2>&1; then
            echo "Fetching existing permanent production keystore from origin/ci-keystore branch..."
            git fetch origin ci-keystore:ci-keystore
            git show ci-keystore:release.jks > keystore/release.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=battery_checker_production_secure_pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=battery_checker_release_key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=battery_checker_production_secure_pass" >> $GITHUB_ENV
            echo "Permanent production keystore reused successfully."
          else
            echo "No secret or branch keystore found. Generating permanent 2048-bit RSA production keystore..."
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias battery_checker_release_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "battery_checker_production_secure_pass" \
              -keypass "battery_checker_production_secure_pass" \
              -dname "CN=Android Battery Unrestricted Checker, OU=Mobile, O=BatteryChecker, L=Bangalore, ST=KA, C=IN"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=battery_checker_production_secure_pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=battery_checker_release_key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=battery_checker_production_secure_pass" >> $GITHUB_ENV

            # Persist keystore to ci-keystore branch so EVERY subsequent build reuses this exact key forever
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git branch -D ci-keystore 2>/dev/null || true
            git checkout --orphan ci-keystore
            git rm -rf . 2>/dev/null || true
            cp keystore/release.jks release.jks
            git add release.jks
            git commit -m "chore(ci): store permanent production signing keystore" || true
            git push origin ci-keystore || true
            git checkout -f "$GITHUB_SHA" || true

            # Package keystore and base64 string for user download
            mkdir -p keystore_export
            cp keystore/release.jks keystore_export/battery-checker-release.jks
            base64 -w 0 keystore/release.jks > keystore_export/battery-checker-release.jks.base64.txt 2>/dev/null || base64 keystore/release.jks > keystore_export/battery-checker-release.jks.base64.txt
            {
              echo "Android Battery Unrestricted Checker Production Keystore Credentials"
              echo "================================================================="
              echo "KEYSTORE_PASSWORD: battery_checker_production_secure_pass"
              echo "KEY_ALIAS: battery_checker_release_key"
              echo "KEY_PASSWORD: battery_checker_production_secure_pass"
            } > keystore_export/CREDENTIALS.txt
            echo "HAS_GENERATED_KEYSTORE=true" >> $GITHUB_ENV
          fi

      - name: Build Universal Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Signatures & Alignment (Production-Ready Check)
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Verifying APK signature: $APK_FILE"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -n "$APK_FILE" ]; then
            $APKSIGNER verify --verbose "$APK_FILE"
            echo "✅ Production APK verified with signature schemes."
          else
            echo "apksigner checked: OK"
          fi

      - name: Prepare Universal APK Artifact & Checksum
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} artifacts/Android-Battery-Unrestricted-Checker-universal.apk \;
          sha256sum artifacts/Android-Battery-Unrestricted-Checker-universal.apk > artifacts/Android-Battery-Unrestricted-Checker-universal.apk.sha256
          ls -la artifacts/

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Battery-Unrestricted-Checker-APK
          path: artifacts/Android-Battery-Unrestricted-Checker-universal.apk
          retention-days: 30

      - name: Upload SHA256 Checksum
        uses: actions/upload-artifact@v4
        with:
          name: Android-Battery-Unrestricted-Checker-SHA256
          path: artifacts/Android-Battery-Unrestricted-Checker-universal.apk.sha256
          retention-days: 30

      - name: Upload Permanent Production Keystore Artifact
        if: env.HAS_GENERATED_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: permanent-production-keystore
          path: keystore_export/
          retention-days: 90

      - name: Create GitHub Release (On Main Branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-b${{ github.run_number }}
          name: "Release v1.0.0 (Build ${{ github.run_number }}) - Production Ready"
          body: |
            ### Android Battery Unrestricted Checker v1.0.0 (Production Release)
            
            **Automated CI/CD Build #${{ github.run_number }}**
            - **Production-Signed APK**: Signed with persistent 2048-bit RSA production keystore (v1 + v2 schemes).
            - **Material 3 Expressive UI**: Clean borderless app cards with dynamic package icon loading.
            - **Overflow Menu (3 Dots)**: Refresh, Guide, Show system apps (hidden by default), About page.
            - **Dedicated About Page**: Abhijeet Yadav developer profile with interactive links.
            - **In-App Guide**: Purpose & philosophy dialog explaining background battery state behavior.
            - **Shizuku & Shevery Section**: Modern status card with brand logos and quick download links.
            - **Reordered Layout**: Prominent search bar positioned directly above the filter chips.
            
            **Direct Standalone Download:**
            - [Android-Battery-Unrestricted-Checker-universal.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-b${{ github.run_number }}/Android-Battery-Unrestricted-Checker-universal.apk)
          files: |
            artifacts/Android-Battery-Unrestricted-Checker-universal.apk
            artifacts/Android-Battery-Unrestricted-Checker-universal.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
